plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'baritone'
version = '1.20.0-1.7.10-dev'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion.set('1.7.10')
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://babbaj.github.io/maven/' }
}

configurations {
    embedded {
        transitive = false
    }
}

sourceSets {
    api {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    main {
        java.srcDirs = ['src/main/java', 'src/api/java', 'src/launch/java', 'src/schematica_api/java']
        resources.srcDirs = ['src/main/resources', 'src/launch/resources']
    }
    test {
        java.srcDirs = ['src/test/java']
        resources.srcDirs = ['src/test/resources']
    }
}

dependencies {
    embedded 'org.spongepowered:mixin:0.8.7'
    embedded 'it.unimi.dsi:fastutil:8.5.12'
    embedded 'dev.babbaj:nether-pathfinder:1.6'
    embedded 'com.google.code.findbugs:jsr305:3.0.2'
    embedded 'org.slf4j:slf4j-api:1.7.30'
    annotationProcessor 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.ow2.asm:asm-tree:9.7'
    annotationProcessor 'org.ow2.asm:asm-commons:9.7'
    annotationProcessor 'com.google.guava:guava:21.0'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    compileOnly 'org.spongepowered:mixin:0.8.7'
    compileOnly 'org.ow2.asm:asm:9.7'
    compileOnly 'org.ow2.asm:asm-tree:9.7'
    compileOnly 'org.ow2.asm:asm-commons:9.7'
    implementation 'dev.babbaj:nether-pathfinder:1.6'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'it.unimi.dsi:fastutil:8.5.12'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    testImplementation 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    testImplementation 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile) {
    def srgTask = tasks.named('generateForgeSrgMappings')
    dependsOn(srgTask)
    outputs.files(layout.buildDirectory.file('generated/baritone.refmap.json'),
            layout.buildDirectory.file('generated/baritone-mixins.srg'))
    options.compilerArgs += [
            "-AreobfSrgFile=${srgTask.get().mcpToSrg.get().asFile}",
            "-AoutRefMapFile=${layout.buildDirectory.file('generated/baritone.refmap.json').get().asFile}",
            "-AoutSrgFile=${layout.buildDirectory.file('generated/baritone-mixins.srg').get().asFile}"
    ]
}

tasks.named('reobfJar') {
    extraSrgFiles.from(layout.buildDirectory.file('generated/baritone-mixins.srg'))
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embedded.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF', 'module-info.class'
    // Forge 1.7's class scanner cannot read the Java 9 ModLauncher integration.
    exclude 'org/spongepowered/asm/launch/MixinLaunchPlugin.class'
    exclude 'org/spongepowered/asm/launch/MixinTransformationService.class'
    exclude 'org/spongepowered/asm/launch/platform/container/ContainerHandleModLauncherEx*.class'
    exclude 'META-INF/services/cpw.mods.modlauncher.*'
    from(layout.buildDirectory.file('generated/baritone.refmap.json'))
    manifest {
        attributes(
                'MixinConfigs': 'mixins.baritone.json',
                'MixinConnector': 'baritone.launch.BaritoneMixinConnector',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'Implementation-Title': 'Baritone',
                'Implementation-Version': project.version
        )
    }
}
